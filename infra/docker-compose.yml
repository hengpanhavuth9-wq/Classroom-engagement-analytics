version: "3.9"

services:
  backend:
    build: ../backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:  postgresql://reli:secret@postgres:5432/reli_db
      REDIS_URL:     redis://redis:6379
      SECRET_KEY:    dev-secret-key
      CORS_ORIGINS:  '["http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL:  ws://localhost:8000
        # Must match backend's SECRET_KEY — see app/api/security.py.
        NEXT_PUBLIC_API_TOKEN: dev-secret-key
    ports:
      - "3000:3000"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER:     reli
      POSTGRES_PASSWORD: secret
      POSTGRES_DB:       reli_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reli -d reli_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
