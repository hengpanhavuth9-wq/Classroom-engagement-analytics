version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  backend:
    image: reli-backend:latest
    environment:
      DATABASE_URL:  postgresql://reli:${DB_PASSWORD}@postgres:5432/reli_db
      REDIS_URL:     redis://redis:6379
      SECRET_KEY:    ${SECRET_KEY}
      CORS_ORIGINS:  '["https://reli.yourdomain.com"]'
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    image: reli-frontend:latest
    # NEXT_PUBLIC_* vars are baked in at `next build` time, not read at
    # container start — these must instead be passed as build args to
    # `docker build` (see frontend/Dockerfile) when producing
    # reli-frontend:latest, with NEXT_PUBLIC_API_TOKEN matching backend's
    # SECRET_KEY below.
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     reli
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       reli_db
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  redis_data:
  pg_data:
